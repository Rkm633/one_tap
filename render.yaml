services:
  - type: web
    name: edutaai-whatsapp-service
    # 'env: image' को बदलकर 'runtime: image' किया गया है
    runtime: image
    image:
      # 'docker.io/' को हटाकर सही डायरेक्ट पाथ दिया गया है
      url: evolutionapi/evolution-api:v2.1.2
    plan: free
    region: singapore
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_TYPE
        value: http

      # Render URL auto assign
      - key: SERVER_URL
        sync: false

      # Authentication
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: "Mykey123"

      # Database: Local SQLite
      - key: DATABASE_ENABLED
        value: "true"
      # 'local' को बदलकर सही कीवर्ड 'sqlite' किया गया है
      - key: DATABASE_PROVIDER
        value: "sqlite"
      - key: DATABASE_CONNECTION_URI
        value: "file:/tmp/edutaai_sqlite.db"
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"

      # Storage flags false (ताकि सर्वर पर रैम लोड न बढ़े)
      - key: DATABASE_SAVE_MESSAGE_HISTORIC
        value: "false"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: STORE_MESSAGES
        value: "false"
      - key: STORE_MESSAGE_UPDATING
        value: "false"
      - key: STORE_CHATS
        value: "false"
      - key: STORE_CONTACTS
        value: "false"

      # Session & Manager Customization
      - key: DEL_INSTANCE
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: "EdutaAI WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_TITLE
        value: "EdutaAI - WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_COLOR
        value: "#075e54"
