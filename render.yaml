services:
  # 1. edutaai - मुख्य व्हाट्सएप एपीआई गेटवे (No External Database)
  - type: web
    name: edutaai-whatsapp-service
    env: docker
    plan: free # पूरी तरह मुफ़्त प्लान
    region: singapore # सबसे तेज़ रीज़न
    dockerCommand: ""
    envVars:
      # डेटाबेस इनेबल रखना है लेकिन उसे लोकल SQLite पर सेट करना है
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: "sqlite"
      - key: DATABASE_CONNECTION_URI
        value: "file:/tmp/edutaai_sqlite.db"

      # सुरक्षा के लिए आपका फिक्स्ड पासवर्ड
      - key: AUTHENTICATION_TYPE
        value: "apikey"
      - key: AUTHENTICATION_API_KEY
        value: "Mykey123"
      
      # व्हाट्सएप सेशन डेटा को अस्थायी फ़ोल्डर में रखना
      - key: CONFIG_LOCAL_STORE_LOCATION
        value: "/tmp"
      - key: DEL_INSTANCE
        value: "false"

      # आपके सॉफ़्टवेयर 'edutaai' की ब्रांडिंग सेटिंग्स
      - key: CONFIG_VIEW_MANAGER_TITLE
        value: "edutaai - WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_COLOR
        value: "#075e54" # व्हाट्सएप ग्रीन थीम
