services:
  - type: web
    name: edutaai-whatsapp-service
    env: image
    image:
      url: atendai/evolution-api:v2.1.2
    plan: free
    region: singapore
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_TYPE
        value: http
      
      # URL Render dwara auto-assign ho jayega
      - key: SERVER_URL
        sync: false

      # Authentication (Har user ke liye safe unique key generate hogi)
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        generateValue: true

      # Database: Bina external DB ke local SQLite use karega
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: local
      - key: DATABASE_CONNECTION_URI
        value: "file:/tmp/edutaai_sqlite.db"
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"

      # No Message/Chat Storage (Data save nahi hoga)
      - key: DATABASE_SAVE_MESSAGE_HISTORIC
        value: "false"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: STORE_MESSAGES
        value: "false"
      - key: STORE_MESSAGE_UPDATING
        value: "false"
      - key: STORE_CHATS
        value: "false"
      - key: STORE_CONTACTS
        value: "false"

      # Session aur Manager Panel Settings
      - key: DEL_INSTANCE
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: "EdutaAI WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_TITLE
        value: "EdutaAI - WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_COLOR
        value: "#075e54"
