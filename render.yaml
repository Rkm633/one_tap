services:
  - type: web
    name: edutaai-whatsapp-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_TYPE
        value: http

      # Default dummy value taaki Render deploy ke waqt ruk kar user se na maange
      - key: SERVER_URL
        value: "http://localhost:8080"

      # Sabhi users ke liye fixed dashboard login password
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: "Mykey123"

      # SQLite settings (No external database needed)
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: "sqlite"
      - key: DATABASE_CONNECTION_URI
        value: "file:/tmp/edutaai_sqlite.db"
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"

      # Messages store nahi honge
      - key: DATABASE_SAVE_MESSAGE_HISTORIC
        value: "false"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: STORE_MESSAGES
        value: "false"
      - key: STORE_MESSAGE_UPDATING
        value: "false"
      - key: STORE_CHATS
        value: "false"
      - key: STORE_CONTACTS
        value: "false"

      # Manager customization
      - key: DEL_INSTANCE
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: "EdutaAI WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_TITLE
        value: "EdutaAI - WhatsApp Gateway"
      - key: CONFIG_VIEW_MANAGER_COLOR
        value: "#075e54"
